apiVersion: cost.cost.platform.io/v1alpha1
kind: NamespaceBudget
metadata:
  labels:
    app.kubernetes.io/name: namespace-cost-governor
    app.kubernetes.io/managed-by: kustomize
  name: namespacebudget-sample
spec:
  monthly:
    cpu: "50"          # core-hours per month
    memory: "200"    # GiB-hours per month
  idleThreshold:
    cpuPercent: 5      # below this = idle
    window: 30m        # averaged over this window
  actions:
    onWarning:         # 80% budget consumed
      - notify: slack
    onExceeded:        # 100% budget consumed
      - notify: slack
      - scaleDownIdle: true   # scale idle Deployments to 0
    onHardLimit:       # 120% budget consumed
      - suspendAll: true      # scale everything to 0
  exclusions:
    - name: payments-db       # never touch this Deployment
    - name: payments-worker
