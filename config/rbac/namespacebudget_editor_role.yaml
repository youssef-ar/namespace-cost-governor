# This rule is not used by the project namespace-cost-governor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cost.cost.platform.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: namespace-cost-governor
    app.kubernetes.io/managed-by: kustomize
  name: namespacebudget-editor-role
rules:
- apiGroups:
  - cost.cost.platform.io
  resources:
  - namespacebudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cost.cost.platform.io
  resources:
  - namespacebudgets/status
  verbs:
  - get
