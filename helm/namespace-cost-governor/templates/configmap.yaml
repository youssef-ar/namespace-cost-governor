apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "namespace-cost-governor.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "namespace-cost-governor.labels" . | nindent 4 }}
data:
  cpuPricePerCoreHour: {{ .Values.pricing.cpuPricePerCoreHour | quote }}
  memPricePerGiBHour: {{ .Values.pricing.memPricePerGiBHour | quote }}